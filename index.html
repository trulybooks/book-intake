<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>書籍入庫</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div id="app">
		<!-- Header -->
		<header class="app-header">
			<h1>📚 書籍入庫</h1>
		</header>

		<!-- Main Container -->
		<main id="main-view">
			<!-- Books View (Default) -->
			<div id="books-view" class="view active">
				<div class="view-header">
					<h2>書籍清單</h2>
					<span id="book-count" class="book-count"></span>
				</div>

				<div class="action-buttons">
					<button id="btn-scan-book" class="btn btn-primary btn-large">📷 掃描</button>
					<button id="btn-add-manual" class="btn btn-secondary btn-large">✏️ 手動輸入</button>
				</div>

				<div class="export-buttons">
					<button id="btn-export" class="btn btn-secondary btn-small">📥 下載</button>
				</div>

				<div id="books-list" class="books-list">
					<!-- Books will be dynamically added here -->
				</div>
			</div>

			<!-- Scanner View -->
			<div id="scanner-view" class="view">
				<div class="view-header">
					<button id="btn-close-scanner" class="btn btn-secondary">✕ 關閉</button>
					<h2>掃描 ISBN 條碼</h2>
				</div>
				<div id="scanner-container">
					<div id="reader"></div>
				</div>
				<div id="scanner-status" class="scanner-status"></div>
			</div>
		</main>

		<!-- Modal for Manual Book Entry -->
		<div id="modal-add-book" class="modal">
			<div class="modal-content">
				<h3>手動輸入 ISBN</h3>
				<input type="text" id="input-isbn" class="input-text"
					placeholder="ISBN（可含連字號）" maxlength="20" required
					autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
				<div class="modal-actions">
					<button id="btn-cancel-book" class="btn btn-secondary">取消</button>
					<button id="btn-save-book" class="btn btn-primary">加入</button>
				</div>
			</div>
		</div>

		<!-- Loading Overlay -->
		<div id="loading-overlay" class="loading-overlay">
			<div class="spinner"></div>
			<p>載入中…</p>
		</div>

		<!-- Toast Notification -->
		<div id="toast" class="toast"></div>
	</div>

	<!-- Scripts -->
	<script type="module" src="dist/bundle.js"></script>
</body>

</html>
